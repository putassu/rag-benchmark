<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>RAG Benchmark Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.5/split.min.js"></script>
    <style>
        :root { --bg-dark: #1e1e2f; --bg-panel: #f8f9fa; --border-color: #dee2e6; --brand-color: #0d6efd; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: var(--bg-panel); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .split-wrapper { display: flex; flex-direction: row; height: 100vh; width: 100vw; }
        .split-pane { overflow-y: auto; overflow-x: hidden; background-color: white; height: 100%; }
        #pane-sidebar { width: 12%; background-color: var(--bg-dark); }
        #pane-docs { width: 18%; }
        #pane-pdf { width: 40%; background: #f1f5f9; }
        #pane-workspace { width: 30%; }
        .gutter { background-color: var(--border-color); cursor: col-resize; transition: 0.2s; }
        .gutter:hover { background-color: var(--brand-color); }
        .gutter.gutter-horizontal { width: 6px; }
        #pane-sidebar { display: flex; flex-direction: column; color: white; }
        #pane-sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; border-left: 3px solid transparent; font-size: 0.95rem; }
        #pane-sidebar a:hover, #pane-sidebar a.active { color: white; background-color: rgba(255,255,255,0.1); border-left-color: var(--brand-color); }
        .doc-item { cursor: pointer; border-left: 4px solid transparent; transition: all 0.15s ease; border-bottom: 1px solid var(--border-color); }
        .doc-item:hover { background-color: #f1f5f9; }
        .doc-item.active { background-color: #eff6ff; border-left-color: var(--brand-color); }
        #pdf-container { display: flex; flex-direction: column; height: 100%; }
        iframe { flex-grow: 1; border: none; width: 100%; }
        .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); border-bottom: 1px solid var(--border-color); padding: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .chunk-list { padding: 15px; }
        .chunk-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 12px; background: white; transition: 0.1s; }
        .chunk-card:hover { border-color: #adb5bd; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .chunk-card.selected-high { border: 2px solid #198754; background-color: #f0fdf4; }
        .chunk-card.selected-low { border: 2px solid #0dcaf0; background-color: #f0f9ff; }
        .highlight { background-color: #fef08a; font-weight: 500; border-radius: 2px; padding: 0 2px; }
        #loginOverlay { position: fixed; inset: 0; background: var(--bg-panel); z-index: 9999; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="card shadow-sm border-0" style="width: 380px; border-radius: 12px;">
        <div class="card-body p-4">
            <h4 class="text-center mb-4 fw-bold"><i class="bi bi-robot text-primary"></i> RAG Bench</h4>
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Логин</label>
                <input type="text" id="username" class="form-control form-control-lg">
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">Пароль</label>
                <input type="password" id="password" class="form-control form-control-lg">
            </div>
            <button class="btn btn-primary btn-lg w-100 fw-bold" onclick="login()">Войти в платформу</button>
        </div>
    </div>
</div>

<div class="split-wrapper" id="appContent" style="display: none;">
    <div id="pane-sidebar" class="split-pane">
        <div class="p-4"><h5 class="text-white fw-bold m-0"><i class="bi bi-robot text-primary me-2"></i> RAG Bench</h5></div>
        <a href="#" class="active"><i class="bi bi-pencil-square me-3"></i> Разметка данных</a>
        <a href="#" class="text-secondary" onclick="alert('Модуль в разработке')"><i class="bi bi-speedometer2 me-3"></i> Запуск тестов</a>
        <a href="#" class="text-secondary" onclick="alert('Модуль в разработке')"><i class="bi bi-gear me-3"></i> Конфигурация</a>
        <div class="mt-auto p-3" style="width: 100%;">
            <button class="btn btn-outline-light w-100" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Выйти</button>
        </div>
    </div>

    <div id="pane-docs" class="split-pane border-end">
        <div class="p-3 border-bottom bg-light sticky-top">
            <h6 class="m-0 fw-bold text-secondary">Очередь документов</h6>
        </div>
        <div id="docList"></div>
    </div>

    <div id="pane-pdf" class="split-pane border-end">
        <div id="pdf-container">
            <div class="p-2 border-bottom bg-white d-flex justify-content-between align-items-center">
                <div class="text-truncate fw-bold text-secondary ps-2" id="currentDocTitle" style="max-width: 60%;">Документ не выбран</div>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-danger d-none shadow-sm" id="resetMarkupBtn" onclick="resetMarkup()">
                        <i class="bi bi-trash3"></i> Сбросить
                    </button>
                    <button class="btn btn-sm btn-outline-success d-none shadow-sm" id="markDoneBtn" onclick="toggleDocComplete()">
                        <i class="bi bi-check2-circle"></i> Завершить
                    </button>
                </div>
            </div>
            <iframe id="pdfViewer"></iframe>
        </div>
    </div>

    <div id="pane-workspace" class="split-pane">
        <div class="sticky-header">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="text-primary fw-bold m-0" id="formTitle"><i class="bi bi-plus-circle me-2"></i>Новый Q&A</h6>
                <button class="btn btn-sm btn-outline-secondary d-none" id="cancelEditBtn" onclick="cancelEdit()">Отменить ред.</button>
            </div>
            
            <textarea id="questionInput" class="form-control mb-3" rows="2" placeholder="Что спрашивает пользователь?"></textarea>
            
            <div class="p-2 bg-light rounded border mb-3">
                <div class="text-muted small fw-bold mb-2">Выбранные чанки и фразы:</div>
                <div id="selectedChunksBadgeList" class="d-flex flex-column gap-2">
                    <span class="text-muted small">Кликните «Основа» или «Контекст» на чанке ниже</span>
                </div>
            </div>
            
            <button class="btn btn-primary w-100 fw-bold shadow-sm" id="saveQaBtn" onclick="saveQA()">Добавить в датасет</button>
        </div>

        <div id="savedQaContainer" class="p-3 bg-white border-bottom" style="display: none;">
            <h6 class="fw-bold text-secondary mb-3"><i class="bi bi-collection"></i> Сохраненные пары (<span id="qaCountBadge">0</span>)</h6>
            <div id="savedQaList" class="d-flex flex-column gap-2"></div>
        </div>

        <div class="chunk-list bg-light">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="m-0 fw-bold text-secondary">Текст документа</h6>
            </div>
            <input type="text" id="searchInput" class="form-control mb-4 shadow-sm" placeholder="Поиск фрагмента текста..." oninput="filterChunks()">
            <div id="chunksList">
                <div class="text-center text-muted mt-5">Выберите документ для начала работы</div>
            </div>
        </div>
    </div>
</div>

<script>
    let token = localStorage.getItem('token');
    let currentDocId = null;
    let allChunks = [];
    
    // ВАЖНО: Теперь это МАССИВ объектов, что позволяет иметь дубликаты чанков
    let selectedChunks = []; 
    let loadedQAs = []; 
    let editingQaId = null; 

    // Генератор уникального UI ID для каждой карточки в боковой панели
    function generateUiId() { return Math.random().toString(36).substr(2, 9); }

    if (token) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('appContent').style.display = 'flex';
        initSplitter(); loadDocuments();
    }

    async function login() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const fd = new FormData(); fd.append('username', u); fd.append('password', p);
        const res = await fetch('/api/token', { method: 'POST', body: fd });
        
        if (res.ok) {
            const data = await res.json();
            localStorage.setItem('token', data.access_token); token = data.access_token;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appContent').style.display = 'flex';
            initSplitter(); loadDocuments();
        } else { alert('Ошибка авторизации. Проверьте логин и пароль.'); }
    }

    function logout() { localStorage.removeItem('token'); location.reload(); }

    async function authFetch(url, options = {}) {
        options.headers = { ...options.headers, 'Authorization': `Bearer ${token}` };
        const res = await fetch(url, options);
        if (res.status === 401) logout();
        return res;
    }

    function initSplitter() {
        try {
            Split(['#pane-sidebar', '#pane-docs', '#pane-pdf', '#pane-workspace'], {
                sizes: [12, 18, 40, 30], minSize: [60, 200, 300, 350], gutterSize: 6, snapOffset: 0
            });
        } catch (e) { console.error("Split.js fallback:", e); }
    }

    async function loadDocuments() {
        const res = await authFetch('/api/documents');
        const docs = await res.json();
        const list = document.getElementById('docList');
        
        list.innerHTML = docs.map(d => `
            <div class="p-3 doc-item ${d.status === 'Готово' ? 'bg-light' : ''}" 
                 id="doc-item-${d.id}" onclick="openDoc(${d.id}, '${d.filename}', '${d.status}')">
                <div class="fw-bold mb-1" style="font-size: 0.85rem; word-break: break-all; color: ${d.status === 'Готово' ? '#198754' : '#212529'}">
                    ${d.status === 'Готово' ? '<i class="bi bi-check-circle-fill me-1"></i>' : ''}${d.filename}
                </div>
                <div class="mt-2"><span class="badge ${d.qa_count > 0 ? 'bg-primary' : 'bg-secondary'}">${d.qa_count} Q&A</span></div>
            </div>
        `).join('');
    }

    async function toggleDocComplete() {
        if(!currentDocId) return;
        await authFetch(`/api/document/${currentDocId}/complete`, { method: 'POST' });
        loadDocuments();
        const btn = document.getElementById('markDoneBtn');
        if(btn.innerText.includes('Завершить')) {
            btn.innerHTML = '<i class="bi bi-arrow-counterclockwise"></i> Вернуть';
            btn.className = 'btn btn-sm btn-outline-warning';
        } else {
            btn.innerHTML = '<i class="bi bi-check2-circle"></i> Завершить';
            btn.className = 'btn btn-sm btn-outline-success';
        }
    }

    async function resetMarkup() {
        if(!currentDocId) return;
        const isConfirmed = confirm("⚠️ Удалить ВСЮ разметку (вопросы и чанки) для этого документа?");
        if(!isConfirmed) return;
        
        const res = await authFetch(`/api/document/${currentDocId}/reset`, { method: 'DELETE' });
        if(res.ok) {
            cancelEdit();
            await loadSavedQAs();
            loadDocuments(); 
            const btn = document.getElementById('markDoneBtn');
            btn.innerHTML = '<i class="bi bi-check2-circle"></i> Завершить';
            btn.className = 'btn btn-sm btn-outline-success shadow-sm';
        } else { alert("⚠️ Ошибка сброса: " + ((await res.json()).detail || "Неизвестная ошибка")); }
    }

    async function openDoc(docId, filename, status) {
        document.querySelectorAll('.doc-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`doc-item-${docId}`).classList.add('active');
        
        currentDocId = docId;
        document.getElementById('currentDocTitle').innerText = filename;
        
        const encodedFilename = encodeURIComponent(filename);
        const fileUrl = `/docs/${encodedFilename}`;
        const ext = filename.split('.').pop().toLowerCase();
        const supportedFormats = ['pdf', 'txt', 'png', 'jpg', 'jpeg'];
        const pdfContainer = document.getElementById('pdfViewer');
        
        let fallbackDiv = document.getElementById('noPreviewFallback');
        if (!fallbackDiv) {
            fallbackDiv = document.createElement('div');
            fallbackDiv.id = 'noPreviewFallback';
            fallbackDiv.className = 'flex-column justify-content-center align-items-center h-100 bg-light';
            pdfContainer.parentNode.insertBefore(fallbackDiv, pdfContainer);
        }
        
        if (supportedFormats.includes(ext)) {
            fallbackDiv.classList.add('d-none'); fallbackDiv.classList.remove('d-flex');
            pdfContainer.classList.remove('d-none'); pdfContainer.src = fileUrl;
        } else {
            pdfContainer.classList.add('d-none');
            fallbackDiv.classList.remove('d-none'); fallbackDiv.classList.add('d-flex');
            fallbackDiv.innerHTML = `
                <i class="bi bi-file-earmark-word display-1 text-secondary mb-3"></i>
                <h5 class="text-secondary">Предпросмотр недоступен</h5>
                <p class="text-muted small">Браузер не поддерживает отображение файлов .${ext}</p>
                <a href="${fileUrl}" class="btn btn-primary mt-2" target="_blank" download>
                    <i class="bi bi-download me-2"></i>Скачать оригинал
                </a>`;
        }
        
        const btn = document.getElementById('markDoneBtn');
        btn.classList.remove('d-none');
        btn.innerHTML = status === 'Готово' ? '<i class="bi bi-arrow-counterclockwise"></i> Вернуть' : '<i class="bi bi-check2-circle"></i> Завершить';
        btn.className = status === 'Готово' ? 'btn btn-sm btn-outline-warning shadow-sm' : 'btn btn-sm btn-outline-success shadow-sm';
        
        document.getElementById('resetMarkupBtn').classList.remove('d-none');
        
        cancelEdit(); 
        document.getElementById('chunksList').innerHTML = '<div class="text-center mt-4"><div class="spinner-border text-primary"></div></div>';
        
        const res = await authFetch(`/api/document/${docId}/chunks`);
        allChunks = await res.json();
        renderChunks(allChunks);
        await loadSavedQAs(); 
    }

    async function loadSavedQAs() {
        if (!currentDocId) return;
        const res = await authFetch(`/api/document/${currentDocId}/qa`);
        loadedQAs = await res.json();
        
        const container = document.getElementById('savedQaContainer');
        const list = document.getElementById('savedQaList');
        document.getElementById('qaCountBadge').innerText = loadedQAs.length;
        
        if (loadedQAs.length === 0) { container.style.display = 'none'; return; }
        
        container.style.display = 'block';
        list.innerHTML = loadedQAs.map(qa => {
            const chunksHtml = (qa.relevant_chunks || []).map(c => {
                const phrase = c.key_phrase || 'Без фразы';
                return `<span class="badge ${c.relevance === 2 ? 'bg-success' : 'bg-info text-dark'} text-truncate" style="max-width: 180px;" title="${phrase.replace(/"/g, '&quot;')}">
                            ${c.chunk_id.substring(0,6)}: ${phrase}
                        </span>`;
            }).join(' ');

            return `
            <div class="card shadow-sm border-0 bg-light">
                <div class="card-body p-2">
                    <div class="d-flex justify-content-between align-items-start">
                        <strong class="text-dark small d-block mb-1">${qa.question}</strong>
                        <div class="btn-group btn-group-sm ms-2" style="flex-shrink: 0;">
                            <button class="btn btn-outline-primary" onclick="editQA(${qa.id})" title="Редактировать"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-outline-danger" onclick="deleteQA(${qa.id})" title="Удалить"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                    <div class="d-flex flex-wrap gap-1 mt-1">${chunksHtml}</div>
                </div>
            </div>`;
        }).join('');
    }

    async function deleteQA(qaId) {
        if (!confirm("Удалить эту Q&A пару?")) return;
        const res = await authFetch(`/api/qa/${qaId}`, { method: 'DELETE' });
        if (res.ok) {
            if (editingQaId === qaId) cancelEdit(); 
            await loadSavedQAs(); loadDocuments(); 
        } else { alert("Ошибка удаления"); }
    }

    function editQA(qaId) {
        const qa = loadedQAs.find(q => q.id === qaId);
        if (!qa) return;
        editingQaId = qaId;
        document.getElementById('questionInput').value = qa.question;

        // Очищаем текущий массив и заполняем из базы
        selectedChunks = (qa.relevant_chunks || []).map(c => ({
            uiId: generateUiId(),
            chunkId: c.chunk_id,
            relevance: c.relevance,
            keyPhrase: c.key_phrase || ""
        }));

        updateSelectionBadges();
        document.querySelectorAll('.chunk-card').forEach(card => updateChunkVisuals(card.id.replace('chunk-', '')));

        document.getElementById('formTitle').innerHTML = '<i class="bi bi-pencil-square me-2"></i>Редактирование Q&A';
        document.getElementById('formTitle').classList.replace('text-primary', 'text-warning');
        
        const btn = document.getElementById('saveQaBtn');
        btn.innerHTML = '<i class="bi bi-save"></i> Обновить Q&A';
        btn.classList.replace('btn-primary', 'btn-warning');
        document.getElementById('cancelEditBtn').classList.remove('d-none');
        document.getElementById('pane-workspace').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        editingQaId = null;
        document.getElementById('questionInput').value = '';
        selectedChunks = []; updateSelectionBadges();
        
        document.querySelectorAll('.chunk-card').forEach(card => {
            card.classList.remove('selected-high', 'selected-low');
            card.querySelectorAll('button').forEach(b => b.classList.remove('active', 'fw-bold'));
        });

        document.getElementById('formTitle').innerHTML = '<i class="bi bi-plus-circle me-2"></i>Новый Q&A';
        document.getElementById('formTitle').classList.replace('text-warning', 'text-primary');
        
        const btn = document.getElementById('saveQaBtn');
        btn.innerHTML = 'Добавить в датасет';
        btn.classList.replace('btn-warning', 'btn-primary');
        document.getElementById('cancelEditBtn').classList.add('d-none');
    }

    function renderChunks(chunks, keyword = '') {
        const list = document.getElementById('chunksList');
        if (chunks.length === 0) return list.innerHTML = '<div class="text-center text-muted mt-4">Ничего не найдено</div>';

        list.innerHTML = chunks.map(c => {
            let text = c.text;
            if(keyword) {
                const re = new RegExp(`(${keyword})`, 'gi');
                text = text.replace(re, '<span class="highlight">$1</span>');
            }
            
            const instances = selectedChunks.filter(sc => sc.chunkId === c.id);
            let extraClass = '', btnH = '', btnL = '';
            
            if (instances.length > 0) {
                if (instances[0].relevance === 2) { extraClass = 'selected-high'; btnH = 'active fw-bold'; }
                else { extraClass = 'selected-low'; btnL = 'active fw-bold'; }
            }
            
            return `
            <div class="chunk-card ${extraClass}" id="chunk-${c.id}">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="badge bg-light text-secondary border">Idx: ${c.start_index}</span>
                    <div class="btn-group shadow-sm">
                        <button class="btn btn-sm btn-outline-success ${btnH}" onclick="toggleChunk('${c.id}', 2)">Основа</button>
                        <button class="btn btn-sm btn-outline-info ${btnL}" onclick="toggleChunk('${c.id}', 1)">Контекст</button>
                    </div>
                </div>
                <p class="mb-0 text-dark" style="font-size: 0.9rem; line-height: 1.5;">${text}</p>
            </div>`;
        }).join('');
    }

    function toggleChunk(chunkId, relevance) {
        const existing = selectedChunks.filter(c => c.chunkId === chunkId);
        
        if (existing.length > 0) {
            if (existing[0].relevance === relevance) {
                // Если кликнули на ту же кнопку - полностью удаляем чанк из выборки
                selectedChunks = selectedChunks.filter(c => c.chunkId !== chunkId);
            } else {
                // Если кликнули на другую - меняем релевантность у всех копий этого чанка
                selectedChunks.forEach(c => { if(c.chunkId === chunkId) c.relevance = relevance; });
            }
        } else {
            // Добавляем новый чанк
            selectedChunks.push({ uiId: generateUiId(), chunkId: chunkId, relevance: relevance, keyPhrase: "" });
        }
        
        updateChunkVisuals(chunkId);
        updateSelectionBadges();
    }

    function updateChunkVisuals(id) {
        const card = document.getElementById(`chunk-${id}`);
        if(!card) return;
        
        card.classList.remove('selected-high', 'selected-low');
        const btns = card.querySelectorAll('button');
        btns.forEach(b => b.classList.remove('active', 'fw-bold'));
        
        const instances = selectedChunks.filter(c => c.chunkId === id);
        if (instances.length > 0) {
            if (instances[0].relevance === 2) {
                card.classList.add('selected-high'); btns[0].classList.add('active', 'fw-bold');
            } else {
                card.classList.add('selected-low'); btns[1].classList.add('active', 'fw-bold');
            }
        }
    }

    // Дублирование чанка для ввода второй фразы
    function duplicateChunkInstance(chunkId, relevance) {
        selectedChunks.push({ uiId: generateUiId(), chunkId: chunkId, relevance: relevance, keyPhrase: "" });
        updateSelectionBadges();
    }

    // Удаление конкретной фразы
    function removeChunkInstance(uiId, chunkId) {
        selectedChunks = selectedChunks.filter(c => c.uiId !== uiId);
        updateChunkVisuals(chunkId);
        updateSelectionBadges();
    }

    function updateKeyPhrase(uiId, val) {
        const item = selectedChunks.find(c => c.uiId === uiId);
        if (item) item.keyPhrase = val;
    }

    function updateSelectionBadges() {
        const container = document.getElementById('selectedChunksBadgeList');
        if(selectedChunks.length === 0) {
            container.innerHTML = '<span class="text-muted small">Кликните «Основа» или «Контекст» на чанке ниже</span>';
            return;
        }
        
        container.innerHTML = selectedChunks.map(data => {
            const cls = data.relevance === 2 ? 'bg-success' : 'bg-info text-dark';
            const label = data.relevance === 2 ? 'Основа' : 'Контекст';
            
            return `
            <div class="w-100 bg-white border rounded p-2 shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="badge ${cls}">${label}: ${data.chunkId.substring(0,8)}...</span>
                    <div>
                        <button class="btn btn-sm btn-light py-0 px-1 text-primary me-1 border" onclick="duplicateChunkInstance('${data.chunkId}', ${data.relevance})" title="Добавить еще фразу для этого же чанка">
                            <i class="bi bi-plus"></i> Фраза
                        </button>
                        <button class="btn btn-sm btn-light py-0 px-1 text-danger border" onclick="removeChunkInstance('${data.uiId}', '${data.chunkId}')" title="Удалить">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
                <input type="text" class="form-control form-control-sm" 
                       placeholder="Ключевая фраза (любые символы, включая запятые)" 
                       value="${data.keyPhrase.replace(/"/g, '&quot;')}" 
                       oninput="updateKeyPhrase('${data.uiId}', this.value)">
            </div>`;
        }).join('');
    }

    function filterChunks() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        renderChunks(allChunks.filter(c => c.text.toLowerCase().includes(q)), q);
    }

    async function saveQA() {
        const q = document.getElementById('questionInput').value.trim();
        
        // Подготавливаем чанки (обрезаем пробелы по краям фразы)
        const chunksArr = selectedChunks.map(data => {
            return { chunk_id: data.chunkId, relevance: data.relevance, key_phrase: data.keyPhrase.trim() };
        });
        
        if(!q || chunksArr.length === 0) return alert("⚠️ Заполните вопрос и выберите чанки!");
        
        const url = editingQaId ? `/api/qa/${editingQaId}` : '/api/qa';
        const method = editingQaId ? 'PUT' : 'POST';
        
        const res = await authFetch(url, {
            method: method, headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ document_id: currentDocId, question: q, relevant_chunks: chunksArr })
        });
        
        if(res.ok) {
            cancelEdit(); await loadSavedQAs(); loadDocuments(); 
            const btn = document.getElementById('saveQaBtn');
            const orig = btn.innerHTML;
            btn.innerHTML = '<i class="bi bi-check-lg"></i> Успешно!'; btn.classList.replace('btn-primary', 'btn-success');
            setTimeout(() => { btn.innerHTML = orig; btn.classList.replace('btn-success', 'btn-primary'); }, 1500);
        } else { 
            const errData = await res.json();
            alert("⚠️ Ошибка: " + (Array.isArray(errData.detail) ? errData.detail.map(e => e.msg).join('\n') : errData.detail));
        }
    }
</script>
</body>
</html>
