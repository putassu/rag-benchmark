<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>RAG Benchmark Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.9.2/split.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #1e1e2f;
            --bg-panel: #f8f9fa;
            --border-color: #dee2e6;
            --brand-color: #0d6efd;
        }

        body { 
            background-color: var(--bg-panel); 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- Custom Scrollbar for Big-Tech feel --- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* --- Split.js Layout --- */
        .split-wrapper { display: flex; height: 100vh; width: 100vw; }
        
        .split-pane { 
            overflow-y: auto; 
            overflow-x: hidden;
            background-color: white;
        }

        /* The draggable gutter */
        .gutter {
            background-color: var(--border-color);
            background-repeat: no-repeat;
            background-position: 50%;
            cursor: col-resize;
            transition: background-color 0.2s;
        }
        .gutter:hover { background-color: var(--brand-color); }
        .gutter.gutter-horizontal { cursor: col-resize; width: 4px; }

        /* --- Specific Panel Styling --- */
        #sidebar { background-color: var(--bg-dark); color: white; display: flex; flex-direction: column; }
        #sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; border-left: 3px solid transparent; font-size: 0.95rem; }
        #sidebar a:hover, #sidebar a.active { color: white; background-color: rgba(255,255,255,0.1); border-left-color: var(--brand-color); }

        .doc-item { cursor: pointer; border-left: 4px solid transparent; transition: all 0.15s ease; border-bottom: 1px solid var(--border-color); }
        .doc-item:hover { background-color: #f1f5f9; }
        .doc-item.active { background-color: #eff6ff; border-left-color: var(--brand-color); }

        /* --- PDF Viewer --- */
        #pdf-container { display: flex; flex-direction: column; height: 100%; background: #f1f5f9; }
        iframe { flex-grow: 1; border: none; width: 100%; }

        /* --- Annotation Form --- */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        /* --- Chunks --- */
        .chunk-list { padding: 15px; }
        .chunk-card { 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            padding: 12px; 
            margin-bottom: 12px; 
            background: white; 
            transition: 0.2s; 
        }
        .chunk-card:hover { border-color: #adb5bd; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .chunk-card.selected-high { border: 2px solid #198754; background-color: #f0fdf4; }
        .chunk-card.selected-low { border: 2px solid #0dcaf0; background-color: #f0f9ff; }
        
        .highlight { background-color: #fef08a; font-weight: 500; border-radius: 2px; padding: 0 2px; }

        /* --- Login Overlay --- */
        #loginOverlay { position: fixed; inset: 0; background: var(--bg-panel); z-index: 9999; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="card shadow-sm border-0" style="width: 380px; border-radius: 12px;">
        <div class="card-body p-4">
            <h4 class="text-center mb-4 fw-bold"><i class="bi bi-robot text-primary"></i> RAG Bench</h4>
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Логин</label>
                <input type="text" id="username" class="form-control form-control-lg" value="sasha">
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">Пароль</label>
                <input type="password" id="password" class="form-control form-control-lg" value="123">
            </div>
            <button class="btn btn-primary btn-lg w-100 fw-bold" onclick="login()">Войти в платформу</button>
        </div>
    </div>
</div>

<div class="split-wrapper" id="appContent" style="display: none;">
    
    <div id="pane-sidebar" class="split-pane" style="background-color: var(--bg-dark);">
        <div class="p-4">
            <h5 class="text-white fw-bold m-0"><i class="bi bi-robot text-primary me-2"></i> RAG Bench</h5>
        </div>
        <a href="#" class="active"><i class="bi bi-pencil-square me-3"></i> Разметка датасета</a>
        <a href="#" class="text-secondary" onclick="alert('Модуль в разработке')"><i class="bi bi-speedometer2 me-3"></i> Запуск тестов</a>
        <a href="#" class="text-secondary" onclick="alert('Модуль в разработке')"><i class="bi bi-gear me-3"></i> Конфигурация</a>
        
        <div class="mt-auto p-3" style="position: absolute; bottom: 0; width: inherit;">
            <button class="btn btn-outline-light w-100" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Выйти</button>
        </div>
    </div>

    <div id="pane-docs" class="split-pane border-end">
        <div class="p-3 border-bottom bg-light sticky-top">
            <h6 class="m-0 fw-bold text-secondary">Очередь документов</h6>
        </div>
        <div id="docList">
            </div>
    </div>

    <div id="pane-pdf" class="split-pane border-end">
        <div id="pdf-container">
            <div class="p-2 border-bottom bg-white d-flex justify-content-between align-items-center">
                <div class="text-truncate fw-bold text-secondary ps-2" id="currentDocTitle" style="max-width: 70%;">Документ не выбран</div>
                <button class="btn btn-sm btn-outline-success d-none shadow-sm" id="markDoneBtn" onclick="toggleDocComplete()">
                    <i class="bi bi-check2-circle"></i> Завершить
                </button>
            </div>
            <iframe id="pdfViewer"></iframe>
        </div>
    </div>

    <div id="pane-workspace" class="split-pane">
        
        <div class="sticky-header">
            <h6 class="text-primary fw-bold mb-3"><i class="bi bi-plus-circle me-2"></i>Новый Q&A</h6>
            
            <textarea id="questionInput" class="form-control mb-2" rows="2" placeholder="Что спрашивает пользователь?"></textarea>
            <input type="text" id="keywordInput" class="form-control mb-3" placeholder="Ключевая фраза (для assert'ов)">
            
            <div class="p-2 bg-light rounded border mb-3">
                <div class="text-muted small fw-bold mb-2">Выбранные чанки:</div>
                <div id="selectedChunksBadgeList" class="d-flex flex-wrap gap-1">
                    <span class="text-muted small">Кликните «Основа» или «Контекст» на чанке ниже</span>
                </div>
            </div>
            
            <button class="btn btn-primary w-100 fw-bold shadow-sm" onclick="saveQA()">Добавить в датасет</button>
        </div>

        <div class="chunk-list">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="m-0 fw-bold text-secondary">Текст документа</h6>
            </div>
            <input type="text" id="searchInput" class="form-control mb-4 shadow-sm" placeholder="Поиск фрагмента текста..." oninput="filterChunks()">
            
            <div id="chunksList">
                <div class="text-center text-muted mt-5">Выберите документ для начала работы</div>
            </div>
        </div>

    </div>
</div>

<script>
    let token = localStorage.getItem('token');
    let currentDocId = null;
    let allChunks = [];
    let selectedChunks = {}; 

    // --- Auth Logic ---
    if (token) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('appContent').style.display = 'flex';
        initSplitter();
        loadDocuments();
    }

    async function login() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const fd = new FormData();
        fd.append('username', u); fd.append('password', p);
        
        const res = await fetch('/api/token', { method: 'POST', body: fd });
        if (res.ok) {
            const data = await res.json();
            localStorage.setItem('token', data.access_token);
            token = data.access_token;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appContent').style.display = 'flex';
            initSplitter();
            loadDocuments();
        } else {
            alert('Ошибка авторизации. Проверьте логин и пароль.');
        }
    }

    function logout() {
        localStorage.removeItem('token');
        location.reload();
    }

    async function authFetch(url, options = {}) {
        options.headers = { ...options.headers, 'Authorization': `Bearer ${token}` };
        const res = await fetch(url, options);
        if (res.status === 401) logout();
        return res;
    }

    // --- UI Init ---
    function initSplitter() {
        // Пропорции панелей: Сайдбар (12%), Документы (18%), PDF (40%), Разметка (30%)
        Split(['#pane-sidebar', '#pane-docs', '#pane-pdf', '#pane-workspace'], {
            sizes: [12, 18, 40, 30],
            minSize: [60, 200, 300, 350],
            gutterSize: 6,
            snapOffset: 0
        });
    }

    // --- Core Data Logic ---
    async function loadDocuments() {
        const res = await authFetch('/api/documents');
        const docs = await res.json();
        
        const list = document.getElementById('docList');
        list.innerHTML = docs.map(d => `
            <div class="p-3 doc-item ${d.status === 'Готово' ? 'bg-light' : ''}" 
                 id="doc-item-${d.id}" onclick="openDoc(${d.id}, '${d.filename}', '${d.status}')">
                <div class="fw-bold mb-1" style="font-size: 0.85rem; word-break: break-all; color: ${d.status === 'Готово' ? '#198754' : '#212529'}">
                    ${d.status === 'Готово' ? '<i class="bi bi-check-circle-fill me-1"></i>' : ''}${d.filename}
                </div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <span class="badge ${d.qa_count > 0 ? 'bg-primary' : 'bg-secondary'} rounded-pill">${d.qa_count} Q&A</span>
                </div>
            </div>
        `).join('');
    }

    async function openDoc(docId, filename, status) {
        document.querySelectorAll('.doc-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`doc-item-${docId}`).classList.add('active');
        
        currentDocId = docId;
        document.getElementById('currentDocTitle').innerText = filename;
        document.getElementById('pdfViewer').src = `/docs/${filename}`;
        
        const btn = document.getElementById('markDoneBtn');
        btn.classList.remove('d-none');
        btn.innerHTML = status === 'Готово' ? '<i class="bi bi-arrow-counterclockwise"></i> Вернуть в работу' : '<i class="bi bi-check2-circle"></i> Завершить документ';
        btn.className = status === 'Готово' ? 'btn btn-sm btn-outline-warning' : 'btn btn-sm btn-outline-success';
        
        selectedChunks = {}; 
        updateSelectionBadges();
        
        document.getElementById('chunksList').innerHTML = '<div class="text-center mt-4"><div class="spinner-border text-primary" role="status"></div></div>';
        
        const res = await authFetch(`/api/document/${docId}/chunks`);
        allChunks = await res.json();
        renderChunks(allChunks);
    }

    async function toggleDocComplete() {
        if(!currentDocId) return;
        await authFetch(`/api/document/${currentDocId}/complete`, { method: 'POST' });
        loadDocuments();
        
        const btn = document.getElementById('markDoneBtn');
        if(btn.innerText.includes('Завершить')) {
            btn.innerHTML = '<i class="bi bi-arrow-counterclockwise"></i> Вернуть в работу';
            btn.className = 'btn btn-sm btn-outline-warning';
        } else {
            btn.innerHTML = '<i class="bi bi-check2-circle"></i> Завершить документ';
            btn.className = 'btn btn-sm btn-outline-success';
        }
    }

    function renderChunks(chunks, keyword = '') {
        const list = document.getElementById('chunksList');
        
        if (chunks.length === 0) {
            list.innerHTML = '<div class="text-center text-muted mt-4">Ничего не найдено</div>';
            return;
        }

        list.innerHTML = chunks.map(c => {
            let text = c.text;
            if(keyword) {
                const re = new RegExp(`(${keyword})`, 'gi');
                text = text.replace(re, '<span class="highlight">$1</span>');
            }
            
            let extraClass = '';
            if(selectedChunks[c.id] === 2) extraClass = 'selected-high';
            else if(selectedChunks[c.id] === 1) extraClass = 'selected-low';
            
            // ВАЖНО: c.id обернуты в кавычки '${c.id}', т.к. это UUID строки!
            return `
            <div class="chunk-card ${extraClass}" id="chunk-${c.id}">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="badge bg-light text-secondary border">Idx: ${c.start_index}</span>
                    <div class="btn-group shadow-sm">
                        <button class="btn btn-sm btn-outline-success ${selectedChunks[c.id] === 2 ? 'active fw-bold' : ''}" 
                                onclick="toggleChunk('${c.id}', 2)">Основа</button>
                        <button class="btn btn-sm btn-outline-info ${selectedChunks[c.id] === 1 ? 'active fw-bold' : ''}" 
                                onclick="toggleChunk('${c.id}', 1)">Контекст</button>
                    </div>
                </div>
                <p class="mb-0 text-dark" style="font-size: 0.9rem; line-height: 1.5;">${text}</p>
            </div>`;
        }).join('');
    }

    function toggleChunk(id, relevance) {
        if(selectedChunks[id] === relevance) {
            delete selectedChunks[id]; 
        } else {
            selectedChunks[id] = relevance; 
        }
        filterChunks(); 
        updateSelectionBadges();
    }

    function updateSelectionBadges() {
        const container = document.getElementById('selectedChunksBadgeList');
        const keys = Object.keys(selectedChunks);
        if(keys.length === 0) {
            container.innerHTML = '<span class="text-muted small">Кликните «Основа» или «Контекст» на чанке ниже</span>';
            return;
        }
        
        container.innerHTML = keys.map(id => {
            const rel = selectedChunks[id];
            const cls = rel === 2 ? 'bg-success' : 'bg-info text-dark';
            const label = rel === 2 ? 'Основа' : 'Контекст';
            const shortId = id.substring(0, 8) + '...'; // Сокращаем длинный UUID для красоты
            return `<span class="badge ${cls} shadow-sm border border-light" title="${id}">${label}: ${shortId}</span>`;
        }).join('');
    }

    function filterChunks() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allChunks.filter(c => c.text.toLowerCase().includes(q));
        renderChunks(filtered, q);
    }

    async function saveQA() {
        const q = document.getElementById('questionInput').value.trim();
        const kw = document.getElementById('keywordInput').value.trim();
        
        const chunksArr = Object.entries(selectedChunks).map(([id, rel]) => ({ chunk_id: id, relevance: rel }));
        
        if(!q || !kw || chunksArr.length === 0) {
            return alert("⚠️ Заполните вопрос, ключевую фразу и выберите хотя бы один чанк!");
        }
        
        const res = await authFetch('/api/qa', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ document_id: currentDocId, question: q, key_phrase: kw, relevant_chunks: chunksArr })
        });
        
        if(res.ok) {
            // Очистка формы с красивым UX
            document.getElementById('questionInput').value = '';
            document.getElementById('keywordInput').value = '';
            selectedChunks = {};
            updateSelectionBadges();
            filterChunks();
            loadDocuments(); 
            
            // Маленький фидбек пользователю
            const btn = document.querySelector('.sticky-header .btn-primary');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="bi bi-check-lg"></i> Сохранено!';
            btn.classList.replace('btn-primary', 'btn-success');
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.replace('btn-success', 'btn-primary');
            }, 1500);
            
        } else {
            const data = await res.json();
            alert(data.detail || "Ошибка сохранения");
        }
    }
</script>
</body>
</html>
